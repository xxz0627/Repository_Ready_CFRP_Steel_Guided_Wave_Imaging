[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfrp-guided-wave-imaging"
version = "1.0.0"
description = "Same-scan statistical-background guided-wave attenuation imaging for CFRP-steel interfacial debonding"
requires-python = ">=3.10"
authors = [
  {name = "Jian Jiang"},
  {name = "Xianze Xiao"},
  {name = "Yabin Liang"},
  {name = "Heng Li", email = "henrylee_wh@foxmail.com"}
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-image>=0.21",
  "matplotlib>=3.7",
  "openpyxl>=3.1"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
